<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#F6F7FB; --carte:#FFFFFF; --trait:#E1E5EF;
  --encre:#0D1B33; --encre-2:#33446A; --encre-3:#5B6888;
  --bleu:#1F5EE8; --bleu-clair:#3FA3FF; --bleu-pale:#E8F0FF; --bleu-fonce:#1745B8;
  --ambre:#8A6014; --ambre-pale:#FAF3E4; --ambre-trait:#EFE2C6;
  --vert:#3F8F6B; --vert-pale:#E9F3EE;
  --rouge:#A23B2E; --rouge-pale:#FBEAE7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--encre);
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px}
p{margin:0 0 10px}

/* connexion */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--encre)}
.gbox{background:var(--carte);border-radius:14px;padding:30px 28px;width:min(400px,100%);
  transform:translateY(6px);opacity:0;animation:rise .5s .05s ease forwards}
@keyframes rise{to{transform:none;opacity:1}}
.gbox.leaving{transition:transform .3s,opacity .3s;transform:translateY(-6px);opacity:0}
#gate,#app{transition:opacity .45s ease}
#gate.out{opacity:0;pointer-events:none}
#app.in{opacity:0}
.gerr{color:var(--rouge);font-size:13px;margin-top:8px;min-height:18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}

/* shell */
.top{background:var(--carte);border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.topin{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo span{color:var(--bleu-clair)}
.burger{background:none;border:0;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:8px}
.burger:hover{background:var(--bleu-pale)}
.burger span{display:block;width:18px;height:2px;background:var(--encre);border-radius:2px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--encre-2);cursor:pointer;font-weight:500;white-space:nowrap;
  transition:background .2s,color .2s,transform .15s}
.tab:hover{background:var(--bleu-pale)} .tab:active{transform:scale(.96)}
.tab.on{background:var(--encre);color:#fff}
.tab .n{font-size:12px;margin-left:5px;opacity:.6}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--encre-3)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px}
#view.sw{animation:swap .34s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* atoms */
.btn{background:var(--bleu);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:none;color:var(--encre);border:1px solid var(--trait)}
.btn.g:hover{background:var(--bleu-pale);filter:none}
.btn.sm{padding:6px 11px;font-size:13.5px;font-weight:500}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:18px}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--trait);border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bleu);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:12.5px;color:var(--encre-3);margin-bottom:4px}
.field{margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--fond);color:var(--encre-2);border:1px solid var(--trait);white-space:nowrap}
.tag.b{background:var(--bleu-pale);color:var(--bleu-fonce);border-color:#C6E0E5}
.tag.v{background:var(--vert-pale);color:var(--vert);border-color:#CDE4DA}
.tag.a{background:var(--ambre-pale);color:var(--ambre);border-color:var(--ambre-trait)}
.tag.r{background:var(--rouge-pale);color:var(--rouge);border-color:#E8C9C4}
.mut{color:var(--encre-3)} .sm{font-size:13.5px} .xs{font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--encre-3);border:1px dashed var(--trait);border-radius:var(--r);background:var(--carte)}
.empty b{display:block;color:var(--encre);margin-bottom:6px}
.hr{height:1px;background:var(--trait);border:0;margin:16px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--trait);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--encre-2)}
.chip.on{background:var(--encre);color:#fff;border-color:var(--encre)}

/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;
  justify-content:space-between;min-height:112px;transition:transform .16s,box-shadow .16s,border-color .16s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,42,46,.09);border-color:#C6D6D8}
.tile:active{transform:scale(.98)}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1}
.tile .k{font-size:13px;color:var(--encre-2);font-weight:500;margin-top:8px;line-height:1.3}
.tile .s{font-size:11.5px;color:var(--encre-3);margin-top:2px}
.tile.dark{background:var(--encre);border-color:var(--encre)} .tile.dark .v{color:#fff} .tile.dark .k{color:#BCD4D8} .tile.dark .s{color:#88A2A6}
.tile.b{background:var(--bleu-pale);border-color:#C6E0E5} .tile.b .v{color:var(--bleu-fonce)}
.tile.v{background:var(--vert-pale);border-color:#CDE4DA} .tile.v .v{color:var(--vert)}
.tile.a{background:var(--ambre-pale);border-color:var(--ambre-trait)} .tile.a .v{color:var(--ambre)}
.secth{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.secth h2{font-size:15px}
.secth span{font-size:12.5px;color:var(--encre-3)}
.bar{height:6px;background:var(--fond);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bleu)}
.jauge{height:10px;background:var(--fond);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--bleu-clair),var(--bleu));transition:width .4s}

/* tableau */
.tw{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:9px 12px;color:var(--encre-3);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--trait);
  white-space:nowrap;background:var(--carte);position:sticky;top:0;cursor:pointer;user-select:none}
th.s{color:var(--encre)}
td{padding:9px 12px;border-bottom:1px solid #F0F2F8;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#F6FAFA}
tbody tr.sel{background:var(--bleu-pale)}
td.ck,th.ck{width:34px;padding-right:0}
td .who2{font-weight:600}
td .sub{font-size:12px;color:var(--encre-3)}
.more{text-align:center;padding:12px}
.mc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.lst{display:flex;flex-direction:column;gap:8px}

/* fiche client */
.hero{position:relative;background:linear-gradient(135deg,var(--encre),#1B3F86);color:#fff;border-radius:14px;padding:20px 20px 18px;margin:-4px 0 6px}
.hero .tag{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff}
.hero .tag.v{background:rgba(63,143,107,.35)} .hero .tag.b{background:rgba(87,176,190,.3)} .hero .tag.a{background:rgba(240,196,106,.3)} .hero .tag.r{background:rgba(162,59,46,.4)}
.hnom{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:4px;padding-right:30px}
.hsub{font-size:13.5px;color:#BCD4D8}
.hop{margin-top:12px;padding:9px 12px;background:rgba(255,255,255,.1);border-radius:8px;font-size:13.5px}
.hact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hact .btn{text-decoration:none}
.opc{border:1px solid var(--trait);border-left:3px solid var(--bleu);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.opg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.opg div{background:var(--fond);border-radius:6px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column}
.datebox{display:flex;align-items:center;gap:12px}
.datebox input[type=date]{width:auto;min-width:170px;padding:9px 12px;border-radius:10px;border:1px solid var(--trait);background:var(--fond);font-weight:500;color:var(--encre);-webkit-appearance:none;appearance:none}
.datebox input[type=date]::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}
.zone{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;vertical-align:1px;letter-spacing:.02em}
.zone.H1{background:#2C6FB5} .zone.H2{background:#E08A2E} .zone.H3{background:#C8422B} .zone.DOM{background:var(--vert)}
table.mini{width:100%;border-collapse:collapse;font-size:13px} table.mini th{text-align:left;font-weight:600;color:var(--encre-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--trait)} table.mini td{padding:7px 8px;border-bottom:1px solid #F0F2F8}
.gsync{white-space:nowrap;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;margin-right:6px} .gsync.ok{color:var(--vert);background:var(--vert-pale)} .gsync.sync{color:var(--bleu);background:#E8F3F5} .gsync.err{color:var(--rouge);background:#FBE9E6}
/* panneau */
.ovl{position:fixed;inset:0;background:rgba(16,42,46,.42);z-index:80;display:flex;justify-content:flex-end;animation:ovin .25s ease}
.ovl.closing{animation:ovout .2s ease forwards}
@keyframes ovin{from{background:rgba(16,42,46,0)}} @keyframes ovout{to{background:rgba(16,42,46,0)}}
.pane{background:var(--carte);width:min(620px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-8px 0 30px rgba(16,42,46,.15);
  animation:slide .3s cubic-bezier(.2,.8,.2,1);overflow-wrap:anywhere}
.ovl.closing .pane{animation:slideout .2s ease forwards}
@keyframes slide{from{transform:translateX(40px);opacity:0}} @keyframes slideout{to{transform:translateX(30px);opacity:0}}
.pane header{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.x{background:none;border:0;cursor:pointer;color:var(--encre-3);font-size:20px;line-height:1;padding:0 4px}
.sec{padding:14px 0;border-top:1px solid var(--trait)}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sech h3{font-size:12.5px;color:var(--encre-3);font-weight:600}
.sech .btn{margin-left:auto}
.kv{display:grid;grid-template-columns:minmax(110px,140px) 1fr;gap:7px 12px;font-size:14px}
.kv dt{color:var(--encre-3)} .kv dd{margin:0;min-width:0}
.pane a{color:var(--bleu);text-decoration:none}
.note{background:var(--fond);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13.5px;white-space:pre-wrap}
.hist{padding:6px 0;border-bottom:1px solid #F0F2F8}
.actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--trait);position:sticky;bottom:0;background:var(--carte);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--encre);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:13.5px;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* menu latéral */
.dovl{position:fixed;inset:0;background:rgba(16,42,46,.42);z-index:90;animation:ovin .25s ease}
.dovl.closing{animation:ovout .2s ease forwards}
.dpane{width:min(320px,86%);height:100%;background:var(--carte);box-shadow:8px 0 30px rgba(16,42,46,.18);padding:20px 16px;
  display:flex;flex-direction:column;overflow:auto;animation:dslide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dslide{from{transform:translateX(-30px);opacity:.4}}
.dlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:9px;
  cursor:pointer;font-size:14.5px;color:var(--encre);transition:background .15s}
.dlink:hover{background:var(--bleu-pale)}
.dlink.on{background:var(--encre);color:#fff;font-weight:600}
.dsep{height:1px;background:var(--trait);margin:12px 0}
.dfoot{margin-top:auto;font-size:12px;color:var(--encre-3);line-height:1.5;padding:12px}
.page h2{margin:22px 0 8px} .page p,.page ul{font-size:14.5px;color:var(--encre-2);max-width:62ch}

/* enrichissement */
.qrow{border:1px solid var(--trait);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fff}
.cand{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--trait);border-radius:8px;padding:9px 11px;margin-top:6px;cursor:pointer}
.cand:hover{border-color:var(--bleu);background:var(--bleu-pale)}
.cand b{font-size:13.5px}
.cand .xs{color:var(--encre-3)}

/* assistant */
.abtn{position:fixed;right:18px;bottom:18px;z-index:45;width:54px;height:54px;border-radius:50%;background:var(--encre);color:#fff;border:0;
  cursor:pointer;box-shadow:0 8px 24px rgba(16,42,46,.28);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.abtn:hover{transform:scale(1.06)} .abtn:active{transform:scale(.95)}
.abtn svg{width:24px;height:24px}
.aovl{position:fixed;inset:0;background:rgba(16,42,46,.42);z-index:95;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 18px 18px;animation:ovin .25s}
.aovl.closing{animation:ovout .18s forwards}
.apane{width:min(420px,100%);height:min(620px,82vh);background:var(--carte);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(16,42,46,.3);animation:apop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes apop{from{transform:translateY(20px) scale(.97);opacity:0}}
.ahead{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--trait)}
.abody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.avide{color:var(--encre-3);font-size:13.5px;text-align:center;margin:auto;line-height:1.7}
.amsg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5}
.amsg.u{align-self:flex-end;background:var(--encre);color:#fff;border-bottom-right-radius:4px}
.amsg.a{align-self:flex-start;background:var(--fond);border:1px solid var(--trait);border-bottom-left-radius:4px}
.ares{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ait{background:#fff;border:1px solid var(--trait);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column}
.ait:hover{border-color:var(--bleu)}
.ait b{font-size:13px} .ait span{font-size:11.5px;color:var(--encre-3)}
.asugg{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-top:1px solid var(--trait)}
.asugg .chip{white-space:nowrap}
.ain{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--trait)}
.ain input{flex:1}

@media(max-width:820px){
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{min-height:100px;padding:14px;border-radius:14px} .tile .v{font-size:25px}
}
@media(max-width:700px){
  .topin{padding:10px 12px;flex-wrap:wrap}
  #bNew{order:4;width:100%;margin-top:8px}
  .tabs{order:3;width:100%;margin:6px 0 0;overflow-x:auto}
  .wrap{padding:14px 12px}
  .cols{grid-template-columns:1fr}
  .pane{padding:16px;width:100%}
  input,select,textarea{font-size:16px!important}
  .abtn{right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:48px;height:48px}
  .aovl{padding:0} .apane{height:88vh;width:100%;border-radius:16px 16px 0 0}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.gbox{opacity:1;transform:none}}
/* visite guidée */
.tour{position:fixed;z-index:300;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(460px,calc(100% - 24px));background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:16px 18px;box-shadow:0 16px 44px rgba(13,27,51,.28);animation:tin .25s ease}
.tour .tstep{font-size:12px;color:var(--bleu);font-weight:600;margin-bottom:4px}
.tour h3{margin-bottom:6px;font-size:16px}
.tour p{font-size:14px;color:var(--encre-2);margin:0 0 12px;line-height:1.45}
.tour .tbtns{display:flex;gap:8px;align-items:center}
.tour-hi{outline:3px solid var(--bleu)!important;outline-offset:4px;border-radius:10px;box-shadow:0 0 0 8px rgba(31,94,232,.16)!important}
/* ---------- script d'éligibilité dans la fiche ---------- */
.sbox{border:1px solid #C5D3F6;background:var(--bleu-pale);border-radius:12px;padding:12px 14px;margin:10px 0 12px}
.sbox .st{font-size:12px;font-weight:700;color:var(--bleu-fonce);text-transform:uppercase;letter-spacing:.05em}
.sbox .sf{font-size:14px;font-weight:600;margin:3px 0 8px}
.sbox .btn.w{font-size:15px;padding:11px 14px}
.sbox .btn.w.pulse{animation:spulse 1.4s ease-in-out infinite}
@keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(31,94,232,.45)}50%{box-shadow:0 0 0 8px rgba(31,94,232,0)}}
.sres{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--trait)}
.sres b.v{color:var(--vert)} .sres b.r{color:var(--rouge)} .sres b.a{color:var(--ambre)}

const Store=(()=>{
  const ws=typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';
  let dbp=null;
  const idb=()=>{if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('francebase2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});return dbp;};
  const hasIDB=typeof indexedDB!=='undefined';
  async function iget(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result===undefined?null:t.result);t.onerror=()=>rej(t.error);});}
  async function iset(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'));});}
  async function idel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
  let mode=ws?'artifact':hasIDB?'idb':'local';
  return{
    mode:()=>mode,
    async get(k){
      if(mode==='artifact'){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}
      if(mode==='idb'){try{const v=await iget(k);if(v!==null)return v;}catch(e){mode='local';}}
      try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}
    },
    async set(k,v){
      if(mode==='artifact'){await window.storage.set(k,JSON.stringify(v));return;}
      if(mode==='idb'){try{await iset(k,v);try{localStorage.removeItem(k);}catch(e){}return;}catch(e){mode='local';}}
      try{localStorage.setItem(k,JSON.stringify(v));}catch(e){throw new Error('stockage plein');}
    },
    async del(k){
      if(mode==='artifact'){try{await window.storage.delete(k);}catch(e){}return;}
      if(mode==='idb'){try{await idel(k);}catch(e){}}
      try{localStorage.removeItem(k);}catch(e){}
    }
  };

const HAY=new WeakMap();
function filtrer(){
  const ql=norm(q);
  return fiches.filter(f=>{
    if(fSect.length&&!fSect.some(x=>f.secteur===x||(f.autres||[]).some(a=>a.secteur===x)))return false;
    if(fZone&&(f.zone||'Métropole')!==fZone)return false;
    if(fTerr.length&&!fTerr.some(t=>matchTerr(f,t)))return false;
    if(fChauf&&norm(f.chauffage||'')!==norm(fChauf))return false;
    if(fAnn&&(f.annotation||'')!==fAnn)return false;
    if(fStat.length&&!fStat.includes(f.statut||'Non traité'))return false;
    if(fSrc.length&&!fSrc.some(x=>(f.source||'').startsWith(x)))return false;
    if(fEnr==='tel'&&!f.tel)return false;
    if(fEnr==='soc'&&!f.raison_sociale)return false;
    if(fEnr==='sect'&&!f.secteur)return false;
    if(fEnr==='naf'&&!f.naf)return false;
    if(fEnr==='sansnaf'&&f.naf)return false;
    if(fEnr==='mail'&&!f.email)return false;
    if(fEnr==='rappel'&&!(f.rappel&&f.rappel<=AUJ()&&f.statut!=='Ne pas recontacter'))return false;
    if(fVisee&&f.fiche_visee!==fVisee)return false;
    if(fFiche&&!(f.ops||[]).some(o=>o.fiche===fFiche))return false;
    if(fType&&(f.type_lead||'')!==fType)return false;
    if(ql){let c=HAY.get(f);if(!c||c.u!==(f._upd||'')+'|'+(f.naf||'')){c={u:(f._upd||'')+'|'+(f.naf||''),h:norm([nomClient(f),f.nom,f.prenom,f.raison_sociale,f.siren,f.siret,f.tel,f.ville,f.cp,f.dept,f.email,f.secteur,f.naf,f.adresse,f.chauffage,f.projet,f.annotation,...(f.autres||[]).map(a=>a.nom+' '+a.secteur),...(f.contacts||[]).map(c=>c.prenom+' '+c.nom)].join(' '))};HAY.set(f,c);}const hay=c.h;
      if(!ql.split(' ').every(w=>hay.includes(w)))return false;}
    return true;
  });
}

/* ---------- fiche client ---------- */
const rappelTxt=d=>{if(!d)return '';const j=Math.round((new Date(d)-new Date(AUJ()))/864e5);return j<0?'en retard de '+(-j)+' j':j===0?'aujourd\'hui':j===1?'demain':'dans '+j+' jours';};
/* enregistrement réel d'une fiche : local d'abord, serveur ensuite, puis redirection vers la rubrique du statut */
let enregEnCours=false;
async function enregistrerFiche(f,id,avecAppel){
  if(enregEnCours)return;enregEnCours=true;
  const b1=document.getElementById('dsave'),b2=document.getElementById('dadd');
  [b1,b2].forEach(b=>{if(b){b.disabled=true;}});if(b1)b1.innerHTML='<span class="spin"></span>Enregistrement…';
  try{
    const av=f.statut;
    const dn=document.getElementById('dn');const note=dn?dn.value.trim():'';
    const lit=()=>{f.statut=document.getElementById('dst').value;f.rappel=document.getElementById('drap').value;f.fiche_visee=document.getElementById('dfv').value;const ch=document.getElementById('dch');if(ch)f.charge=ch.value;if(f.statut==='Ne pas recontacter')f.rappel='';};
    lit();
    if(avecAppel||note||f.statut!==av){f.suivi=f.suivi||[];f.suivi.push({d:AUJ(),t:note,statut:f.statut!=='Non traité'?f.statut:(av&&av!=='Non traité'?'Non traité':''),fiche:f.fiche_visee||'',par:user.nom});}
    if(!f.charge)f.charge=user.nom;
    marquer(f);f._dirty=true;
    await save();
    let partage='';
    if(Serveur.actif()){try{await Serveur.pousser();partage=Serveur.enAttente()?'':' · partagé avec l\'équipe';}catch(e){partage=' · sera envoyé à l\'équipe dès le retour du réseau';}}
    closeModal();
    const cible={'Intéressé':'Intéressé','À rappeler':'À rappeler','RDV pris':'RDV pris','Dossier signé':'Dossier signé','NRP':'NRP','Refus':'Refus'}[f.statut];
    if(cible){fStat=[cible];fSect=[];fTerr=[];fSrc=[];fEnr='';fFiche='';fType='';fVisee='';q='';pageN=60;view='base';}
    render();
    toast((avecAppel?'Appel enregistré':'Fiche enregistrée')+(f.rappel&&f.statut!=='Ne pas recontacter'?' · rappel le '+fmtD(f.rappel):'')+(cible?' · classée dans « '+cible+' »':'')+partage);
  }catch(e){toast('Échec de l\'enregistrement : '+String(e&&e.message||e).slice(0,80));if(b1){b1.disabled=false;b1.textContent='Enregistrer';}if(b2)b2.disabled=false;}
  finally{enregEnCours=false;}
}

/* ---------- enrichissement INSEE ---------- */
const API='https://recherche-entreprises.api.gouv.fr/search';
async function apiSearch(params){
  const u=API+'?'+new URLSearchParams(params).toString();
  const r=await fetch(u);
  if(r.status===429){await new Promise(x=>setTimeout(x,1500));return apiSearch(params);}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function lierSociete(f,c){
  f.autres=f.autres||[];if(f.autres.some(x=>x.siren===c.siren))return;
  const i=nafInfo(c.activite_principale);
  f.autres.push({siren:c.siren,nom:c.nom_complet||'',naf:c.activite_principale||'',naf_lib:i.lib,secteur:i.sect,adresse:c.siege&&c.siege.adresse||''});
}
function appliquerEntreprise(f,e){
  f.enrichi_par=user&&user.nom||'';
  const et=(e.matching_etablissements||[]).find(x=>x.code_postal===f.cp)||e.siege||{};
  f.siren=e.siren||f.siren;
  f.siret=et.siret||f.siret;
  f.naf=e.activite_principale||et.activite_principale||'';
  const info=nafInfo(f.naf);
  f.naf_lib=info.lib;f.secteur=info.sect||f.secteur;f.secteur_src='Code NAF officiel';
  if(!f.raison_sociale)f.raison_sociale=e.nom_complet||'';
  if(!f.adresse&&et.adresse)f.adresse=et.adresse;
  if(!f.cp&&et.code_postal)f.cp=et.code_postal;
  if(!f.ville&&et.libelle_commune)f.ville=et.libelle_commune;
  f.siege=(e.siege&&e.siege.adresse)||'';
  const d=(e.dirigeants||[])[0];
  f.dirigeant=d?[d.prenoms,d.nom].filter(Boolean).join(' ')+(d.qualite?' ('+d.qualite+')':''):'';
  f.enrichi=AUJ();
}
/* ---- matching multi-critères ---- */
function tokens(s){return norm(s).split(' ').filter(w=>w.length>2&&!['sarl','sas','sasu','eurl','sci','societe','ste','ets','eirl','snc','scea','earl','gaec','selarl','the','les','des','and'].includes(w));}
function scorer(f,c){
  const raisons=[];let s=0;
  const cn=norm(c.nom_complet||''), cr=norm(c.nom_raison_sociale||c.nom_complet||''), fr=norm(f.raison_sociale||'');
  if(fr){
    if(cr===fr||cn===fr){s+=40;raisons.push('Nom exact');}
    else if(cr.startsWith(fr)||cn.includes(fr)){s+=30;raisons.push('Nom ≈');}
    else{const tf=tokens(f.raison_sociale),tc=tokens(c.nom_complet);const inter=tf.filter(t=>tc.some(x=>x===t||x.startsWith(t)||t.startsWith(x))).length;
      if(tf.length&&inter){const r=inter/tf.length;s+=Math.round(25*r);if(r>=.5)raisons.push('Nom partiel');}}
  }
  const dn=norm(f.nom), dp=norm(f.prenom);
  const dirs=c.dirigeants||[];
  if(dn&&dirs.some(d=>norm(d.nom)===dn||(d.nom&&norm(d.nom).includes(dn)))){s+=30;raisons.push('Dirigeant : '+dirs.find(d=>norm(d.nom).includes(dn)).nom);
    if(dp&&dirs.some(d=>norm(d.prenoms||'').includes(dp.split(' ')[0]))){s+=12;raisons.push('Prénom ✓');}}
  else if(dn&&(cn.includes(dn)||cr.includes(dn))){s+=18;raisons.push('Nom dans la raison sociale');}
  const etabs=[c.siege,...(c.matching_etablissements||[])].filter(Boolean);
  if(f.cp&&etabs.some(e=>e.code_postal===f.cp)){s+=20;raisons.push('Code postal ✓');}
  else if(f.ville&&etabs.some(e=>norm(e.libelle_commune||'')===norm(f.ville))){s+=15;raisons.push('Commune ✓');}
  else if(f.dept&&etabs.some(e=>(e.departement||'')===f.dept||(e.code_postal||'').startsWith(f.dept.slice(0,2))&&f.dept.startsWith('97')&&(e.code_postal||'').startsWith(f.dept))){s+=8;raisons.push('Département ✓');}
  if(c.etat_administratif==='A')s+=5;else{s-=15;raisons.push('Cessée');}
  return{s,raisons};
}
/* poids d'activité d'une société : effectif, chiffre d'affaires, établissements, catégorie, état */
function poidsActivite(c){
  let p=0;const te=String(c.tranche_effectif_salarie||'');const rang={'00':0,'01':1,'02':2,'03':3,'11':4,'12':5,'21':6,'22':7,'31':8,'32':9,'41':10,'42':11,'51':12,'52':13,'53':14};if(rang[te]!==undefined)p+=rang[te]*10;
  const fin=c.finances||{};const ans=Object.keys(fin).sort();const der=ans.length?fin[ans[ans.length-1]]:null;const ca=der&&(der.ca||der.chiffre_affaires)||0;if(ca>0)p+=Math.min(60,Math.log10(ca)*6);
  p+=Math.min(20,(c.nombre_etablissements_ouverts||c.nombre_etablissements||0)*2);
  const cat=c.categorie_entreprise||'';if(cat==='GE')p+=30;else if(cat==='ETI')p+=20;else if(cat==='PME')p+=10;
  if(c.etat_administratif==='A')p+=15;else p-=40;
  return p;
}
async function memePersonne(f,exclSiren){
  // toutes les sociétés dont la personne est dirigeante, pour recenser ses sous-secteurs
  const pers=[f.prenom,f.nom].filter(Boolean).join(' ').trim();if(!f.nom||pers.length<4)return [];
  try{const j=await apiSearch({q:pers,page:1,per_page:10});const dn=norm(f.nom),dp=norm(f.prenom||'').split(' ')[0];
    return (j.results||[]).filter(c=>c.siren!==exclSiren&&(c.dirigeants||[]).some(d=>norm(d.nom||'')===dn&&(!dp||norm(d.prenoms||'').includes(dp))));
  }catch(e){return [];}
}
async function chercher(f){
  const id=(f.siret||f.siren||'').replace(/\D/g,'');
  if(id.length===14||id.length===9){
    const j=await apiSearch({q:id,page:1,per_page:1});
    if(j.results&&j.results.length){const c=j.results[0];const lier=await memePersonne(f,c.siren);
      // si la personne a une société plus active que celle du SIRET, celle-ci devient principale et le SIRET saisi passe en sous-secteur
      const tous=[c,...lier].sort((a,b)=>poidsActivite(b)-poidsActivite(a));
      return{auto:tous[0],cands:[],lier:tous.slice(1)};}
  }
  const nom=(f.raison_sociale||'').trim(), pers=[f.prenom,f.nom].filter(Boolean).join(' ').trim();
  const requetes=[];
  if(nom.length>2){requetes.push({q:nom,departement:f.dept});requetes.push({q:nom});}
  if(pers.length>3){requetes.push({q:pers,departement:f.dept});if(f.nom&&f.nom.length>3)requetes.push({q:f.nom,departement:f.dept});}
  if(!requetes.length)return{auto:null,cands:[]};
  const vus=new Map();
  for(const p of requetes){
    if(p.departement===undefined||p.departement===''){delete p.departement;}
    const j=await apiSearch(Object.assign({page:1,per_page:8},p));
    (j.results||[]).forEach(c=>{if(!vus.has(c.siren))vus.set(c.siren,c);});
    if(vus.size>=12)break;
    await new Promise(x=>setTimeout(x,120));
  }
  if(!vus.size)return{auto:null,cands:[]};
  const notes=[...vus.values()].map(c=>{const r=scorer(f,c);c._score=r.s;c._raisons=r.raisons;return c;}).sort((a,b)=>b._score-a._score);
  const best=notes[0], second=notes[1];
  // plusieurs sociétés d'une même personne : la principale est la plus active, les autres deviennent ses sous-secteurs
  const dn=norm(f.nom||''),dp=norm(f.prenom||'').split(' ')[0];
  const memes=dn?notes.filter(c=>(c.dirigeants||[]).some(d=>norm(d.nom||'')===dn&&(!dp||norm(d.prenoms||'').includes(dp)))):[];
  if(memes.length>=2){const tri=memes.slice().sort((a,b)=>poidsActivite(b)-poidsActivite(a));return{auto:tri[0],cands:[],lier:tri.slice(1)};}
  if(best._score>=55&&(!second||best._score-second._score>=20)){const lier=await memePersonne(f,best.siren);return{auto:best,cands:[],lier};}
  return{auto:null,cands:notes.filter(c=>c._score>=15).slice(0,6)};
}

async function testerAPI(){
  try{const r=await fetch(API+'?q=DINUM&per_page=1');if(!r.ok)return{ok:false,m:'Le registre répond en erreur ('+r.status+').'};const j=await r.json();return{ok:!!(j&&j.results),m:''};}

async function lancerEnrich(){
  const st0=document.getElementById('enrst');
  if(st0)st0.textContent='Test de connexion au registre…';
  const t=await testerAPI();
  if(!t.ok){if(st0)st0.innerHTML='<span style="color:var(--rouge)">'+esc(t.m)+'</span>';toast('Enrichissement impossible ici');return;}
  arret=false;
  const cibles=fiches.filter(aEnrichir);

  const maj=()=>{Object.assign(enrichEnCours,{ok,amb,rien});const st=document.getElementById('enrst');if(st)st.textContent=`${enrichEnCours.i} / ${cibles.length} traitées — ${ok} validées, ${amb} à arbitrer, ${rien} introuvables`;const bar=document.getElementById('gprog');if(bar){bar.style.display='';bar.querySelector('i').style.width=Math.round(enrichEnCours.i/cibles.length*100)+'%';bar.querySelector('span').textContent=`Enrichissement ${enrichEnCours.i}/${cibles.length}`;}};
  const bs=document.getElementById('bstop');if(bs)bs.style.display='';const bg=document.getElementById('bgo');if(bg)bg.style.display='none';
  maj();
  for(let i=0;i<cibles.length;i++){
    if(arret)break;
    const f=cibles[i];
    let r;
    try{r=await chercher(f);}catch(e){r={auto:null,cands:[],err:1};}
    if(r.err){echecs++;if(echecs>=8){const st=document.getElementById('enrst');if(st)st.innerHTML='<span style="color:var(--rouge)">Le registre ne répond plus. Arrêt — relancez dans quelques minutes.</span>';toast('Registre injoignable, arrêt');break;}}

    else if(r.cands.length){enrichFile.push({f,cands:r.cands});f.enrich_etat='arbitrage';amb++;}
    else if(!r.err){f.enrich_etat='introuvable';rien++;}

}




/* ---------- dédoublonnage ---------- */
function clesDoublon(f){
  const k=[];
  if(f.siret)k.push('s:'+f.siret);
  if(f.siren)k.push('r:'+f.siren);
  const t=(f.tel||'').replace(/\D/g,'');if(t.length>=9)k.push('t:'+t);
  if(f.email&&!f.siret)k.push('m:'+f.email.toLowerCase());
  if(f.raison_sociale&&norm(f.raison_sociale).length>3)k.push('o:'+norm(f.raison_sociale)+'|'+(f.cp||f.territoire||''));
  if(f.nom&&f.prenom)k.push('n:'+norm(f.nom+' '+f.prenom)+'|'+(f.cp||''));
  else if(f.nom&&!f.raison_sociale&&norm(f.nom).length>3)k.push('n1:'+norm(f.nom)+'|'+(f.cp||f.ville||f.territoire||''));
  return k;
}
function fusionner(a,b){
  ['raison_sociale','siret','siren','naf','naf_lib','tel','tel2','email','adresse','cp','ville','dept','territoire','fonction','secteur','secteur_src','dirigeant','siege','enrichi','rappel','fiche_visee','effectif','site','forme','annee'].forEach(k=>{if(!a[k]&&b[k])a[k]=b[k];});
  if(b.contacts&&b.contacts.length&&!(a.contacts&&a.contacts.length))a.contacts=b.contacts;
  if(b.naf&&!a.naf){a.naf=b.naf;a.naf_lib=b.naf_lib;a.secteur=b.secteur;a.secteur_src=b.secteur_src;}
  if((!a.statut||a.statut==='Non traité')&&b.statut)a.statut=b.statut;
  a.suivi=[...(a.suivi||[]),...(b.suivi||[])];
  (b.ops||[]).forEach(o=>{const same=(a.ops||[]).find(x=>x.fiche===o.fiche&&(x.source===o.source||(x.date===o.date&&x.quantite===o.quantite)));if(!same)a.ops.push(o);});
  (b.autres||[]).forEach(x=>{a.autres=a.autres||[];if(!a.autres.some(y=>y.siren===x.siren))a.autres.push(x);});
  if(b.source&&!(a.source||'').includes(b.source))a.source=(a.source?a.source+' + ':'')+b.source;
  recalc(a);
}
function dedoublonner(){
  const idx=new Map();const garde=[];let n=0;
  fiches.forEach(f=>{
    let c=null;for(const k of clesDoublon(f)){if(idx.has(k)){const x=idx.get(k);if(x.siret&&f.siret&&x.siret!==f.siret)continue;c=x;break;}}
    if(c){fusionner(c,f);n++;clesDoublon(c).forEach(k=>{if(!idx.has(k))idx.set(k,c);});}
    else{garde.push(f);clesDoublon(f).forEach(k=>{if(!idx.has(k))idx.set(k,f);});}
  });
  fiches=garde;return n;
}

async function importerActivite(file){
  let j;try{j=JSON.parse(await file.text());}catch(e){toast('Fichier illisible');return;}
  if(!j||!Array.isArray(j.items)){toast('Ce n\'est pas un fichier d\'activité FranceBase');return;}
  const idx=new Map();fiches.forEach(f=>[cleFiche(f),...clesDoublon(f)].forEach(k=>{if(!idx.has(k))idx.set(k,f);}));
  let maj=0,appels=0,enr=0,nouv=0;
  j.items.forEach(it=>{
    let f=null;for(const k of it.k||[]){if(idx.has(k)){f=idx.get(k);break;}}
    if(!f)return;maj++;
    const deja=new Set((f.suivi||[]).map(h=>h.d+'|'+h.t+'|'+h.par));
    (it.suivi||[]).forEach(h=>{if(!deja.has(h.d+'|'+h.t+'|'+h.par)){f.suivi=f.suivi||[];f.suivi.push(h);appels++;}});
    if(it.statut&&it.statut!=='Non traité'){const last=(f.suivi||[]).slice(-1)[0];if(!f.statut||f.statut==='Non traité'||(last&&last.par===it.par&&last.statut))f.statut=it.statut;}
    if(it.rappel&&(!f.rappel||it.rappel<f.rappel))f.rappel=it.rappel;

    if(it.charge&&!f.charge)f.charge=it.charge;
    if(it.elig&&(!f.elig||(it.elig.d||'')>(f.elig.d||'')))f.elig=it.elig;
    if(it.naf&&!f.naf){f.naf=it.naf;f.naf_lib=it.naf_lib;f.secteur=it.secteur;f.secteur_src=it.secteur_src;f.enrichi=it.enrichi;f.enrichi_par=it.enrichi_par;if(it.siret&&!f.siret)f.siret=it.siret;if(it.siren&&!f.siren)f.siren=it.siren;if(it.dirigeant&&!f.dirigeant)f.dirigeant=it.dirigeant;f.enrich_etat='';enr++;}
    if(it.email&&!f.email)f.email=it.email;if(it.tel&&!f.tel)f.tel=it.tel;
    (it.autres||[]).forEach(a=>{f.autres=f.autres||[];if(!f.autres.some(x=>x.siren===a.siren))f.autres.push(a);});
  });

  fiches.forEach(recalc);await save();render();
  toast(`Activité de ${j.par||'?'} importée : ${maj} fiches, ${appels} appels, ${enr} enrichissements, ${nouv} nouvelles fiches`);
}

function parseFile(file){

function telN(v){let d=String(v||'').replace(/\D/g,'');d=d.replace(/^0033/,'33');if(d.startsWith('33')&&d.length>=11)d='0'+d.slice(2);
  for(const ind of ['590','596','594','262','269']){if(d.startsWith(ind)&&d.length>10){const r=d.slice(3);if(r.length===9&&r[0]==='6'){d='0'+r;break;}if(r.length===10&&r[0]==='0'){d=r;break;}}}
  if(d.length===9&&'567'.includes(d[0]))d='0'+d;if(d.length!==10)return String(v||'').trim();return d.replace(/(\d{2})(?=\d)/g,'$1 ');}
async function runImport(){
  const fe=parsed.feuilles[parsed.i], defF=document.getElementById('idfiche').value, typ=document.getElementById('idtype').value, src=document.getElementById('idsrc').value.trim()||fe.n;

  let n=0,dup=0,skip=0;
  fe.rows.forEach(row=>{
    const o={id:uid(),statut:'Non traité',suivi:[],naf:'',naf_lib:'',enrichi:'',email:'',secteur:'',secteur_src:'',source:src,dept:'',territoire:'',ops:[]};
    IMP_FIELDS.forEach(([k])=>{const c=parsed.map[k];o[k]=c?String(row[c]==null?'':row[c]).trim():'';});
    if(!o.nom&&!o.raison_sociale&&!o.tel&&!o.siret){skip++;return;}
    o.tel=telN(o.tel);o.siret=o.siret.replace(/\D/g,'').replace(/^(\d{14}).*$/,'$1');o.siren=(o.siren||o.siret).replace(/\D/g,'').slice(0,9);
    if(o.cp&&o.cp.replace(/\D/g,'').length>5)o.cp=o.cp.replace(/\D/g,'').slice(0,5);
    geo(o);
    if(o.naf){const i=nafInfo(o.naf);if(i.sect){o.secteur=o.secteur||i.sect;o.naf_lib=i.lib;o.secteur_src='Code NAF';}}
    if(o.secteur&&!o.secteur_src)o.secteur_src='Fichier importé';
    if(o.fiche_origine){const c=o.fiche_origine.toUpperCase().replace(/\s/g,'');const hit=FICHES_TOUTES.find(f=>c.includes(f[0]));o.fiche_origine=hit?hit[0]:defF;}
    const fc=o.fiche_origine||defF;
    if(fc||o.luminaires)o.ops.push({fiche:fc,statut:typ==='Client installé'?'Installé':typ==='Prospect'?'Prospect':'Non installé',quantite:o.luminaires||'',unite:'luminaires',surface:o.surface||'',hauteur:'',date:o.date_op||'',poseur:o.poseur||'',commentaire:'',source:src});
    recalc(o);if(!o.ops.length)o.type_lead=typ==='Client installé'?'Installé':typ==='Prospect'?'Prospect':'Non installé';
    const ks=[o.siret,o.siren,o.tel.replace(/\D/g,'')].filter(x=>x&&x.length>=9);if(o.raison_sociale)ks.push('soc:'+norm(o.raison_sociale)+'|'+o.cp);if(o.nom)ks.push('nom:'+norm(o.nom+' '+o.prenom)+'|'+o.cp);

  const data=[ent,...rows.map(f=>cols.map(c=>c==='appels'?(f.suivi||[]).map(h=>[h.d,h.statut,h.fiche,h.t].filter(Boolean).join(' ')).join(' ; '):c==='autres_s'?(f.autres||[]).map(a=>a.nom+' ('+a.secteur+')').join(' ; '):c==='operations'?(f.ops||[]).map(o=>[o.fiche,o.statut,o.quantite?o.quantite+' '+(o.unite||'luminaires'):'',o.surface?o.surface+' m²':'',o.date,o.poseur,o.commentaire].filter(Boolean).join(' | ')).join(' ; '):(f[c]||'')))];

/* ---------- fiches à travailler (liste courte, en tête de chaque menu déroulant) ---------- */
const FICHES_TRAVAIL=['RES-EC-104','BAT-EQ-127','BAR-TH-171','AGRI-EQ-110','TRA-SE-104','IND-UT-137','BAR-TH-168','BAR-EN-101','BAR-EN-102','BAR-EN-103','BAR-EN-106','BAR-EN-107','BAR-TH-124'];
const ficheLigne=(x,n)=>x[0]+' — '+esc(x[1]).slice(0,n||40);
function optFiches(sel,n){
  const T=FICHES_TRAVAIL.map(c=>FICHES_TOUTES.find(x=>x[0]===c)).filter(Boolean);
  const A=FICHES_TOUTES.filter(x=>!FICHES_TRAVAIL.includes(x[0])).slice().sort((a,b)=>a[0].localeCompare(b[0]));
  const o=x=>`<option value="${x[0]}" ${sel===x[0]?'selected':''}>${ficheLigne(x,n)}</option>`;
  return `<optgroup label="Fiches à travailler">${T.map(o).join('')}</optgroup><optgroup label="Toutes les fiches">${A.map(o).join('')}</optgroup>`;
}

      f.elig={code:e.code,txt:r.txt,cls:r.cls,oui,total:Q.length,ko:r.ko.map(q=>q.t.replace(/\s*\?$/,'')),notes,r:Object.assign({},st.r),dd:Object.assign({},st.d),d:AUJ(),par:(user&&user.nom)||''};
      f.fiche_visee=f.fiche_visee||e.code;f.charge=f.charge||(user&&user.nom)||'';
      if(dn)dn.value=(dn.value?dn.value.trim()+'\n':'')+txt;if(dfv&&!dfv.value)dfv.value=e.code;

      const sb=document.getElementById('sbres');if(sb)sb.innerHTML=eligResume(f);const bb=document.getElementById('delig');if(bb)bb.classList.remove('pulse');

    try{await navigator.clipboard.writeText(txt);toast('Résumé copié');}catch(err){prompt('Résumé à copier :',txt);}
  };

const Presence=(()=>{let k='',t=null;
  async function bat(){if(!k||!user)return;try{const l=await Serveur.rpc('fb_presence',{p_k:k});const e=document.getElementById('presence');if(!e)return;if(l&&l.length){e.style.display='';e.innerHTML='<b>'+l.map(esc).join(', ')+'</b> '+(l.length>1?'ont':'a')+' cette fiche ouverte en ce moment.';}else e.style.display='none';}catch(e){}}
  return{ouvrir(f){k=f._k||cleFiche(f);bat();if(t)clearInterval(t);t=setInterval(bat,25000);},fermer(){if(!k)return;k='';if(t)clearInterval(t);t=null;if(user)Serveur.rpc('fb_presence',{p_k:'',p_quitte:true}).catch(()=>{});}};})();
function contexteFiche(f){
  const L=[];const h=(f.suivi||[]).slice(-1)[0];
  if(h){const j=Math.round((Date.now()-new Date(h.d+'T12:00:00').getTime())/864e5);const quand=j<=0?'aujourd\'hui':j===1?'hier':'il y a '+j+' jours';
    L.push((h.par&&h.par!==user.nom&&h.par!=='Campagne'&&j<=14?'<b>Déjà travaillé par '+esc(h.par)+' '+quand+'.</b> ':'Dernier contact : <b>'+esc(h.par||'—')+'</b> · '+quand+'. ')+(h.statut?'Résultat : '+esc(h.statut)+'.':''));}
  else L.push('Jamais appelé.');
  Object.entries(f.camp||{}).forEach(([c,x])=>{const k=CAMP_MAP[c];if(!k||!(x.env||x.file))return;
    L.push('Campagne <b>'+esc(k.fiche)+'</b> : '+(x.env?'offre envoyée le '+fmtD(x.env)+(x.par?' par '+esc(x.par):''):'dans la file d\'envoi')+(x.ret&&CAMP_LIB[x.ret]?' · <b>'+esc(CAMP_LIB[x.ret]).toLowerCase()+'</b>':x.vu?' · a ouvert le lien':x.env?' · pas encore ouvert':'')+(x.issue?' · '+esc(x.issue):'')+'.');});
  return `<div class="hctx">${L.map(t=>`<div>${t}</div>`).join('')}<div id="presence" class="hpres" style="display:none"></div></div>`;
}

  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store',headers:{Range:'bytes=0-1200'}});const t=(await r.text()).slice(0,3000);

async function publierBase(){

async function importerReference(file){
  try{const j=JSON.parse(await file.text());if(j.format!=='francebase-reference'||!Array.isArray(j.DATA))throw new Error('ce n\'est pas un fichier de référence FranceBase');
    const connues=new Set();fiches.forEach(f=>[f._k,cleFiche(f),...clesDoublon(f)].forEach(k=>k&&connues.add(k)));let n=0;
    j.DATA.forEach(row=>{const o={id:uid(),statut:'Non traité',suivi:[],naf:'',naf_lib:'',enrichi:''};j.CH.forEach((c,i)=>o[c]=row[i]===undefined?'':row[i]);if(!Array.isArray(o.contacts))o.contacts=[];
      o.ops=(o.ops||[]).map(x=>Object.assign({fiche:'',statut:'',quantite:'',unite:'luminaires',surface:'',hauteur:'',date:'',poseur:'',commentaire:'',source:''},x));if(!o.secteur){o.secteur='Particulier';o.secteur_src='Lead résidentiel';}else if(!o.secteur_src)o.secteur_src='Nom de société';if(!o.type_lead)o.type_lead='Prospect';if((o.annotation||'').split(' | ').some(x=>x.trim().toUpperCase()==='NRP'))o.statut='NRP';recalc(o);
      if([cleFiche(o),...clesDoublon(o)].some(k=>connues.has(k)))return;o._dirty=true;fiches.push(o);[cleFiche(o),...clesDoublon(o)].forEach(k=>connues.add(k));n++;});
    await save();render();toast(n?n+' fiches de référence ajoutées · elles partent vers le serveur d\'équipe':'Rien à ajouter : toutes les fiches de référence sont déjà là');
  }catch(e){toast('Import impossible : '+String(e&&e.message||e).slice(0,90));}
}

const SUGG=['Appels à passer','À rappeler','NRP','Île-de-France','bilan'];
let chat=[];
function repondre(txt){
  let n=norm(txt);
  const sing=t=>t.split(' ').map(w=>w.length>4&&w.endsWith('s')?w.slice(0,-1):w).join(' ');
  const ns=sing(n);
  const lig=f=>({id:f.id,label:nomClient(f),sub:[f.territoire,f.secteur,f.type_lead].filter(Boolean).join(' · ')});
  const secteurs=[...new Set(fiches.map(f=>f.secteur).filter(Boolean))];
  if(/eligib|question|information cee|qualifier un prospect/.test(n)){return{t:'Les questions d\'éligibilité par fiche sont dans le menu → Information CEE, et dans chaque fiche client sous « Fiche CEE proposée ».',items:[]};}
  if(/effectif|salari|employ/.test(n)){const l=fiches.filter(f=>f.effectif&&(/^\d+$/.test(f.effectif)?+f.effectif>=10:!/0 à 9/.test(f.effectif)));return{t:`${l.length} entreprises de 10 salariés ou plus.`,items:l.slice(0,40).map(f=>({id:f.id,label:nomClient(f),sub:[f.territoire,f.secteur,f.effectif].filter(Boolean).join(' · ')}))};}
  if(/rappel|a appeler|appels/.test(n)){const l=fiches.filter(f=>f.rappel&&f.rappel<=AUJ()&&f.statut!=='Ne pas recontacter');return{t:`${l.length} appel${l.length>1?'s':''} à passer aujourd'hui ou en retard.`,items:l.slice(0,40).map(lig)};}
  {const sy=Object.keys(SECT_SYN).find(k=>n.includes(k));if(sy&&!SECTEURS_LISTE.some(s=>n.includes(norm(s)))){const sec=SECT_SYN[sy];const l=fiches.filter(f=>f.secteur===sec||(f.autres||[]).some(a=>a.secteur===sec));return{t:`${l.length} fiches en ${sec}.`,items:l.slice(0,40).map(lig)};}}
  if(/qualifier|sans secteur|sans naf|manque|inconnu/.test(n)){const l=fiches.filter(f=>!f.secteur);return{t:`${l.length} fiches sans secteur. Lancez l'enrichissement pour les traiter.`,items:l.slice(0,20).map(lig)};}
  const sect=secteurs.find(s=>n.includes(norm(s))||ns.includes(sing(norm(s)))||(n.split(' ')[0].length>4&&norm(s).includes(n.split(' ')[0])));
  if(sect){const l=fiches.filter(f=>f.secteur===sect||(f.autres||[]).some(a=>a.secteur===sect));return{t:`${l.length} fiches en ${sect}.`,items:l.slice(0,40).map(lig)};}
  const terrs=[...new Set(fiches.map(f=>f.territoire).filter(Boolean))];
  const terr=terrs.find(t=>n.includes(norm(t)));
  if(terr){const l=fiches.filter(f=>f.territoire===terr);const s={};l.forEach(f=>{const k=f.secteur||'à qualifier';s[k]=(s[k]||0)+1;});
    const top=Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>k+' '+v).join(', ');
    return{t:`${l.length} fiches en ${terr}. Principaux secteurs : ${top}.`,items:l.slice(0,40).map(lig)};}
  const ty=TYPES.find(s=>n.includes(norm(s))||ns.includes(sing(norm(s))));
  if(ty){const l=fiches.filter(f=>f.type_lead===ty);return{t:`${l.length} fiches ${ty.toLowerCase()}${ty==='Installé'?'es':'s'}.`,items:l.slice(0,40).map(lig)};}
  const mfi=txt.toUpperCase().match(/\b(AGRI|BAR|BAT|IND|RES|TRA)-?\s?([A-Z]{2})-?\s?(\d{3})\b/);
  if(mfi){const code=mfi[1]+'-'+mfi[2]+'-'+mfi[3];const l=fiches.filter(f=>(f.ops||[]).some(o=>o.fiche===code));return{t:`${code} — ${ficheTitre(code)}. ${l.length} client${l.length>1?'s':''}.`,items:l.slice(0,40).map(lig)};}
  const st=STATUTS.find(s=>n.includes(norm(s))||ns.includes(sing(norm(s))));
  if(st){const l=fiches.filter(f=>(f.statut||'Non traité')===st);return{t:`${l.length} fiches au suivi « ${st} ».`,items:l.slice(0,40).map(lig)};}
  if(/bilan|resume|etat|point/.test(n)){const e=fiches.filter(f=>f.naf).length;
    return{t:`${fiches.length} fiches, ${e} enrichies, ${fiches.filter(f=>f.tel).length} avec téléphone, ${fiches.filter(f=>f.statut==='Dossier signé').length} dossiers signés.`,items:[]};}
  const mots=n.split(' ').filter(w=>w.length>2);
  if(mots.length){const l=fiches.filter(f=>{const h=norm([nomClient(f),f.nom,f.prenom,f.raison_sociale,f.ville,f.tel,f.siren,f.siret].join(' '));return mots.every(w=>h.includes(w));});
    if(l.length)return{t:l.length===1?`${nomClient(l[0])} — ${[l[0].ville,l[0].secteur,l[0].tel].filter(Boolean).join(' · ')}.`:`${l.length} résultats.`,items:l.slice(0,40).map(lig)};}
  return{t:'Rien trouvé. Essayez un secteur, un territoire, un nom ou « bilan ».',items:[]};
}

const DOSSIER_ETAPES=[['À rappeler','Demande à être rappelé','st-rappel'],['Rappelé','Appelé, en discussion','st-rappele'],['Intéressé','Intéressé','st-interesse'],['Installation demandée','OK pour installation','st-install'],['RDV pris','Rendez-vous pris','st-rdv'],['Dossier signé','Dossier signé','st-signe']];
let dosTous=null, dosFiche='', dosOuvert={};
function vDossiers(){
  if(dosTous===null)dosTous=!!user.admin;
  const enCampagne=f=>Object.values(f.camp||{}).some(x=>x.ret==='rappel'&&!x.traite);
  const tous=fiches.filter(f=>DOSSIER_ETAPES.some(e=>e[0]===f.statut)&&!enCampagne(f));
  const visibles=tous.filter(f=>(dosTous||f.charge===user.nom||(!f.charge&&dernierPar(f)===user.nom))&&(!dosFiche||f.fiche_visee===dosFiche));
  const fichesV=[...new Set(tous.map(f=>f.fiche_visee).filter(Boolean))].sort();
  const t=AUJ();
  const ligne=f=>{const h=(f.suivi||[]).slice(-1)[0];const retard=f.rappel&&f.rappel<t,jour=f.rappel===t;
    return `<div class="dligne" data-open="${f.id}"><div class="dnom"><b>${esc(nomJoli(nomClient(f)))}</b><span>${esc([f.territoire,nomJoli(f.ville||'')].filter(Boolean).join(' · '))}</span></div>
      <div class="dinfo">${f.fiche_visee?`<span class="tag b">${esc(f.fiche_visee)}</span>`:''}${f.rappel?`<span class="tag ${retard?'r':jour?'a':''}">${retard?'Rappel en retard · ':jour?'À rappeler aujourd\'hui · ':'Rappel le '}${fmtD(f.rappel)}</span>`:''}</div>
      <div class="dqui">${h?`${esc(h.par||'')} · ${fmtD(h.d)}`:'—'}${f.charge?`<span>suivi par ${esc(f.charge)}</span>`:''}</div>
      ${f.tel?`<a class="btn g sm" href="${telHref(f.tel,f)}" onclick="event.stopPropagation()" style="text-decoration:none">Appeler</a>`:'<span></span>'}</div>`;};
  return `<div class="ctete"><h1>Dossiers</h1>
      <div class="seg" style="margin:0"><button class="${dosTous?'':'on'}" data-dtous="0">Mes dossiers</button><button class="${dosTous?'on':''}" data-dtous="1">Toute l'équipe</button></div>
      <select id="dfiche" style="width:auto"><option value="">Toutes les fiches CEE</option>${fichesV.map(k=>`<option ${dosFiche===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>
    <p class="sm mut" style="margin:-4px 0 14px">Les clients en cours de discussion, rangés par étape. Une demande de rappel venue d'une campagne reste dans Campagnes tant que l'appel n'a pas été passé.</p>
    ${visibles.length?DOSSIER_ETAPES.map(([st,lib,cls])=>{const l=visibles.filter(f=>f.statut===st).sort((a,b)=>(a.rappel||'9')<(b.rappel||'9')?-1:1);if(!l.length)return '';const max=dosOuvert[st]?l.length:8;
      return `<div class="detape"><div class="dtete"><span class="tag ${cls}">${l.length}</span><h2>${lib}</h2></div>${l.slice(0,max).map(ligne).join('')}${l.length>max?`<button class="btn g sm" data-dplus="${esc(st)}" style="margin:8px 0 0 12px">Afficher les ${l.length-max} autres</button>`:''}</div>`;}).join(''):`<div class="empty"><b>Aucun dossier en cours</b>${dosTous?'Dès qu\'un client est rappelé, intéressé ou d\'accord pour être installé, il apparaît ici.':'Rien à votre nom pour l\'instant. « Toute l\'équipe » montre les dossiers des autres.'}</div>`}`;
}
const dernierPar=f=>{const h=(f.suivi||[]).slice(-1)[0];return h?h.par:'';};

async function campAjouter(liste,c){
  const camp=CAMP_MAP[c];let n=0,sansMobile=0,deja=0;const t=new Date().toISOString();
  liste.forEach(f=>{if(campExclu(f))return;const x=campDe(f,c);if(x&&(x.file||x.env)){deja++;return;}if(!telMobile(f)){sansMobile++;return;}
    f.camp=f.camp||{};f.camp[c]={j:(x&&x.j)||jeton(),m:(x&&x.m&&x.m!=='defaut'?x.m:camp.metier(f))||'defaut',file:t,env:'',par:user.nom};n++;});
  if(n)await save();
  return {n,sansMobile,deja};
}

/* ---------- retour arrière : geste de glissement depuis le bord gauche, bouton Précédent ---------- */
const Nav=(()=>{
  let pile=[], ignorer=0, applique=false, dernierPop=0, raf=0;
  const ouverts=()=>[['drawer','.dovl'],['assist','.aovl'],['modal','.ovl'],['elig','.ovl']].filter(([id,c])=>{const e=document.getElementById(id);return e&&e.querySelector(c+':not(.closing)');}).map(x=>x[0]);
  const sig=()=>(user?view:'gate')+'|'+ouverts().join('+');
  function sync(){
    if(applique||!user)return;const s=sig(),n=pile.length;
    if(!n){pile=[s];try{history.replaceState({i:0},'');}catch(e){}return;}
    if(s===pile[n-1])return;
    if(n>1&&s===pile[n-2]){pile.pop();ignorer++;try{history.back();}catch(e){ignorer--;}return;}
    pile.push(s);try{history.pushState({i:pile.length-1},'');}catch(e){}
  }
  const plus_tard=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;sync();});};
  function fermerJusqua(cible){
    const garder=new Set((cible.split('|')[1]||'').split('+').filter(Boolean));
    const F={elig:closeElig,modal:closeModal,assist:closeAssist,drawer:closeDrawer};
    ouverts().reverse().forEach(o=>{if(!garder.has(o)){try{F[o]();}catch(e){}}});
  }
  function retour(e){
    dernierPop=Date.now();
    if(ignorer>0){ignorer--;return;}
    if(!user)return;
    const i=e.state&&typeof e.state.i==='number'?e.state.i:0;
    if(i>=pile.length){ignorer++;try{history.back();}catch(x){ignorer--;}return;}   // « suivant » : on ne rejoue pas, on reste où l'on est
    if(pile.length<=1)return;
    pile.length=Math.max(1,i+1);const cible=pile[pile.length-1];
    applique=true;
    try{if(typeof tourI!=='undefined'&&tourI>=0)tourStep(-1);}catch(x){}
    fermerJusqua(cible);
    const v=cible.split('|')[0];
    if(v&&v!=='gate'&&v!==view){view=v;render();}
    setTimeout(()=>{applique=false;pile[pile.length-1]=sig();},320);
  }
  function geste(){
    let x0=0,y0=0,t0=0,actif=false;
    document.addEventListener('touchstart',e=>{const t=e.touches[0];actif=e.touches.length===1&&t.clientX<=26;x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
    document.addEventListener('touchend',e=>{if(!actif)return;actif=false;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=Math.abs(t.clientY-y0);
      if(dx<70||dy>60||Date.now()-t0>700)return;
      const debut=t0;setTimeout(()=>{if(dernierPop>=debut)return;if(pile.length>1)history.back();},80);},{passive:true});
    document.addEventListener('touchcancel',()=>{actif=false;},{passive:true});
  }
  function demarrer(){
    window.addEventListener('popstate',retour);
    new MutationObserver(plus_tard).observe(document.body,{childList:true,subtree:true});
    geste();
  }
  return{sync,demarrer,reinit(){pile=[];sync();},pile:()=>pile.slice()};
})();
